services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      # The site's domain (Caddy gets its HTTPS certificate for it); unset serves plain HTTP on :80
      - DOMAIN=${DOMAIN:-}
      - WWW_DOMAIN=${WWW_DOMAIN:-}
    depends_on:
      - frontend
    networks:
      - zetca-network
    mem_limit: 64m

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      # Locally .env.local; on the server, scripts/deploy.sh points this at /opt/zetca/.env.production
      - ${APP_ENV_FILE:-.env.local}
    environment:
      - NODE_ENV=production
    networks:
      - zetca-network
    # Next.js plus the AI agents; leaves room for Caddy and the OS on a 2 GB server
    mem_limit: 1400m

networks:
  zetca-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
