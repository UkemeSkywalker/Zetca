"space-lg": "1.5rem" }, fontFamily: { "label-lg": ["Plus Jakarta Sans"], "title-md": ["Plus Jakarta Sans"], "headline-lg-mobile": ["Plus Jakarta Sans"], "label-sm": ["Plus Jakarta Sans"], "headline-md": ["Plus Jakarta Sans"], "display-mobile": ["Plus Jakarta Sans"], "headline-lg": ["Plus Jakarta Sans"], "title-sm": ["Plus Jakarta Sans"], "display": ["Plus Jakarta Sans"], "body-sm": ["Plus Jakarta Sans"], "body-md": ["Plus Jakarta Sans"], "headline-sm": ["Plus Jakarta Sans"], "body-lg": ["Plus Jakarta Sans"], "label-md": ["Plus Jakarta Sans"] }, fontSize: { "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }], "title-md": ["16px", { "lineHeight": "24px", "letterSpacing": "-0.005em", "fontWeight": "600" }], "headline-lg-mobile": ["26px", { "lineHeight": "34px", "letterSpacing": "-0.01em", "fontWeight": "700" }], "label-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.04em", "fontWeight": "700" }], "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.015em", "fontWeight": "700" }], "display-mobile": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "800" }], "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "title-sm": ["14px", { "lineHeight": "20px", "letterSpacing": "0em", "fontWeight": "600" }], "display": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.03em", "fontWeight": "800" }], "body-sm": ["13px", { "lineHeight": "18px", "letterSpacing": "0.005em", "fontWeight": "400" }], "body-md": ["14px", { "lineHeight": "22px", "letterSpacing": "0em", "fontWeight": "400" }], "headline-sm": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "body-lg": ["16px", { "lineHeight": "26px", "letterSpacing": "0em", "fontWeight": "400" }], "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600" }] } } } };</script><style>@layer base{html,body{width:100vw;margin:0;padding:0;min-height:100%;}body{overscroll-behavior-y:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head><body class="bg-surface text-on-surface font-body-md text-body-md flex flex-col min-h-screen"><main class="flex flex-col relative w-full pt-safe pb-safe bg-surface min-h-screen"><div class="flex flex-col w-full pb-28">
<!-- Top Bar / Header -->
<header class="w-full px-margin-mobile pt-space-md pb-space-sm flex flex-col gap-space-sm bg-surface">
<div class="flex items-center justify-between">
<div class="flex items-center gap-space-xs">
<span class="text-primary font-display-mobile text-display-mobile tracking-tight">Zetca</span>
</div>
<button aria-label="Open menu" class="w-11 h-11 flex items-center justify-center rounded-xl bg-surface-container text-on-surface hover:bg-surface-container-high transition-colors" type="button">
<span class="material-symbols-outlined text-[24px]">menu</span>
</button>
</div>
<!-- Title Row & Channel Selector Pill -->
<div class="flex flex-col gap-space-xs mt-space-xs">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">New YouTube video</h1>
<div class="flex items-center">
<button class="inline-flex items-center gap-space-xs px-3 py-1.5 rounded-full bg-surface-container-high text-on-surface text-label-md font-label-md active:scale-95 transition-transform" type="button">
<span class="w-5 h-5 rounded-full bg-primary flex items-center justify-center text-on-primary text-[10px] font-bold">AV</span>
<span class="font-semibold text-on-surface">Alex Vance Studio</span>
<span class="text-primary font-medium ml-0.5">Change</span>
</button>
</div>
</div>
</header>
<!-- Main Content Cards -->
<div class="px-margin-mobile flex flex-col gap-space-md mt-space-sm">
<!-- Card 1: Your video -->
<section class="bg-surface-container-lowest rounded-xl p-space-md shadow-sm">
<h2 class="font-title-md text-title-md text-on-surface mb-space-sm">Your video</h2>
<div class="w-full h-36 rounded-xl bg-surface-container-low flex flex-col items-center justify-center gap-2 p-space-md">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center text-outline">
<span class="material-symbols-outlined text-[26px]">movie</span>
</div>
<p class="font-body-md text-body-md text-outline">No video yet</p>
</div>
</section>
<!-- Card 2: Upload dropzone -->
<section class="bg-surface-container-lowest rounded-xl p-space-md shadow-sm">
<div class="w-full rounded-xl bg-surface-container-low p-space-lg flex flex-col items-center text-center transition-all duration-200" id="dropzone">
<!-- Soft circle cloud upload icon -->
<div class="w-16 h-16 rounded-full bg-primary-fixed flex items-center justify-center text-primary mb-space-md">
<span class="material-symbols-outlined text-[32px]">cloud_upload</span>
</div>
<h3 class="font-title-md text-title-md text-on-surface mb-space-xs">Drag and drop a video file</h3>
<p class="font-body-sm text-body-sm text-outline mb-space-sm">or</p>
<label class="cursor-pointer">
<input accept="video/mp4,video/quicktime,video/webm" class="hidden" id="video-file-input" type="file"/>
<span class="inline-flex items-center justify-center h-11 px-space-lg rounded-full bg-primary-container text-on-primary font-label-lg text-label-lg shadow-sm active:scale-95 transition-transform">
            Select file
          </span>
</label>
<p class="font-body-sm text-body-sm text-outline mt-space-md max-w-[260px] leading-relaxed">
          MP4, MOV or WebM. Vertical videos under 3 minutes become Shorts.
        </p>
</div>
</section>
</div>
<!-- Sticky Bottom Bar -->
<div class="fixed bottom-0 left-0 right-0 z-40 bg-surface-container-lowest/95 backdrop-blur-md px-margin-mobile py-space-sm shadow-xl flex flex-col gap-2 max-w-[390px] mx-auto">
<div class="flex items-center justify-center">
<p class="font-body-sm text-body-sm text-outline" id="bottom-status-text">No video selected</p>
</div>
<button class="w-full h-11 rounded-xl bg-surface-variant text-outline cursor-not-allowed font-label-lg text-label-lg flex items-center justify-center transition-all" disabled="" id="schedule-btn" type="button">
      Schedule video
    </button>
</div>
</div>
<script>
  (function() {
    const fileInput = document.getElementById('video-file-input');
    const scheduleBtn = document.getElementById('schedule-btn');
    const statusText = document.getElementById('bottom-status-text');
    const dropzone = document.getElementById('dropzone');

    if (!fileInput || !scheduleBtn || !statusText || !dropzone) return;

    function handleFile(file) {
      if (file) {
        statusText.textContent = file.name;
        statusText.classList.remove('text-outline');
        statusText.classList.add('text-on-surface');

        scheduleBtn.disabled = false;
        scheduleBtn.classList.remove('bg-surface-variant', 'text-outline', 'cursor-not-allowed');
        scheduleBtn.classList.add('bg-primary-container', 'text-on-primary', 'cursor-pointer', 'active:scale-98');
      }
    }

    fileInput.addEventListener('change', function(e) {
      if (e.target.files && e.target.files[0]) {
        handleFile(e.target.files[0]);
      }
    });

    ['dragenter', 'dragover'].forEach(eventName => {
      dropzone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropzone.classList.add('bg-surface-container');
      });
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropzone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropzone.classList.remove('bg-surface-container');
      });
    });

    dropzone.addEventListener('drop', (e) => {
      if (e.dataTransfer.files && e.dataTransfer.files[0]) {
        handleFile(e.dataTransfer.files[0]);
      }
    });
  })();
</script></main></body></html>
